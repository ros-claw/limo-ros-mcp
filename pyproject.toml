[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "limo-ros-mcp"
version = "0.8.9"
description = "Inspection-focused MCP server for the AgileX LIMO ROS 1 platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
authors = [{name = "ROSClaw Team", email = "ai@rosclaw.io"}]
keywords = ["agilex", "limo", "mcp", "robotics", "ros", "rosclaw"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=1.0.0,<2.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0",
  "websocket-client>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.5.0",
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.1.0",
]

[project.scripts]
limo-ros-mcp = "limo_ros_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ros-claw/limo-ros-mcp"
Repository = "https://github.com/ros-claw/limo-ros-mcp"
Issues = "https://github.com/ros-claw/limo-ros-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/limo_ros_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "limo_ros_mcp/data/configs"
"e-urdf-zoo/limo" = "limo_ros_mcp/data/e-urdf-zoo/limo"
"manifest.json" = "limo_ros_mcp/data/manifest.json"
"mcp_config.example.json" = "limo_ros_mcp/data/mcp_config.example.json"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/configs",
  "/e-urdf-zoo",
  "/manifest.json",
  "/mcp_config.example.json",
  "/README.md",
  "/README.zh.md",
  "/AGENTS.md",
  "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"worker/*.py" = ["B904", "C405", "SIM115", "UP015", "UP024", "UP031"]

[tool.ruff.lint.isort]
known-first-party = ["limo_ros_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["live_ros: read-only tests against an operator-started LIMO ROS 1 graph"]
