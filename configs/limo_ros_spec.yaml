schema_version: rosclaw.embodiment_card.v2
robot_id: limo
aliases: [limo, agilex_limo]
body_type: multi_mode_mobile_base

preferred_interfaces:
  - capability_id: limo.navigate_to_pose
    ros_kind: action
    ros_name: /move_base
    ros_type: move_base_msgs/MoveBaseAction
    reason: "ROS navigation provides localization, path planning, and obstacle-aware control."
    args_schema:
      target_pose:
        frame_id: {type: string, enum: [map, odom]}
        x: {type: number}
        y: {type: number}
        yaw: {type: number, minimum: -3.141592653589793, maximum: 3.141592653589793}

  - capability_id: limo.observe.status
    ros_kind: topic
    ros_name: /limo_status
    ros_type: limo_base/LimoStatus
    reason: "Read-only vehicle, battery, error, and motion-mode status."

  - capability_id: limo.observe.odom
    ros_kind: topic
    ros_name: /odom
    ros_type: nav_msgs/Odometry
    reason: "Read-only pose and velocity feedback."

  - capability_id: limo.observe.imu
    ros_kind: topic
    ros_name: /imu
    ros_type: sensor_msgs/Imu
    reason: "Read-only inertial feedback."

  - capability_id: limo.observe.scan
    ros_kind: topic
    ros_name: /scan
    ros_type: sensor_msgs/LaserScan
    reason: "Optional read-only lidar scan used by the navigation costmaps."

  - capability_id: limo.observe.localized_pose
    ros_kind: topic
    ros_name: /amcl_pose
    ros_type: geometry_msgs/PoseWithCovarianceStamped
    reason: "AMCL pose and covariance used to judge localization quality."

  - capability_id: limo.observe.navigation_status
    ros_kind: topic
    ros_name: /move_base/status
    ros_type: actionlib_msgs/GoalStatusArray
    reason: "Current and terminal move_base goal state."

  - capability_id: limo.observe.current_goal
    ros_kind: topic
    ros_name: /move_base/current_goal
    ros_type: geometry_msgs/PoseStamped
    reason: "Current navigation target without submitting a new goal."

  - capability_id: limo.observe.global_plan
    ros_kind: topic
    ros_name: /move_base/GlobalPlanner/plan
    ros_type: nav_msgs/Path
    reason: "Global route geometry for patrol diagnostics."

  - capability_id: limo.observe.local_plan
    ros_kind: topic
    ros_name: /move_base/TrajectoryPlannerROS/local_plan
    ros_type: nav_msgs/Path
    reason: "Local route geometry for obstacle-avoidance diagnostics."

  - capability_id: limo.observe.map_metadata
    ros_kind: topic
    ros_name: /map_metadata
    ros_type: nav_msgs/MapMetaData
    reason: "Map size, resolution, and origin for route preparation."

  - capability_id: limo.observe.diagnostics
    ros_kind: topic
    ros_name: /diagnostics
    ros_type: diagnostic_msgs/DiagnosticArray
    reason: "ROS component health grouped by diagnostic severity."

  - capability_id: limo.observe.tf
    ros_kind: topic
    ros_name: /tf
    ros_type: tf2_msgs/TFMessage
    reason: "Dynamic transform edges required by localization and navigation."

  - capability_id: limo.observe.camera
    ros_kind: topic_group
    ros_names: [/limo/color/image_raw, /limo/depth/image_raw, /limo/depth/points]
    ros_types: [sensor_msgs/Image, sensor_msgs/Image, sensor_msgs/PointCloud2]
    reason: "Documented LIMO RGB-D inspection streams; payloads are summarized by default."

discouraged_interfaces:
  - ros_kind: topic
    ros_name: /cmd_vel
    reason: "Direct velocity publishing bypasses navigation and requires a strict stop guard."

safety_defaults:
  max_linear_velocity: 0.2
  max_angular_velocity: 0.5
  max_motion_duration_sec: 1.0
  require_stop_guard_for_velocity: true
  require_obstacle_check_for_motion: true

preconditions:
  limo.navigate_to_pose:
    - localization_ready
    - costmap_ready
    - obstacle_check_enabled
    - limo_status_fresh
    - error_code == 0
    - motion_mode in [0, 1, 2]

recovery_capabilities:
  - safety.emergency_stop
  - limo.observe.status
  - limo.observe.odom
